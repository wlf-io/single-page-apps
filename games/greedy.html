<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Greedy</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPCEtLSBFcXVhbC1lZGdlIGlzb21ldHJpYyBjdWJlOiAzMMKwIHJob21iaSwgdmVydGljYWwgPSBlZGdlIGxlbmd0aCAtLT4KICA8cGF0aCBmaWxsPSIjM2Q5Y2YwIiBkPSJNMTYgNCAyNi4zOTIgMTAgMTYgMTYgNS42MDggMTBaIi8+CiAgPHBhdGggZmlsbD0iIzJhNmZhZCIgZD0iTTUuNjA4IDEwIDE2IDE2djEybC0xMC4zOTItNloiLz4KICA8cGF0aCBmaWxsPSIjMWU0ZjgyIiBkPSJNMjYuMzkyIDEwIDE2IDE2djEybDEwLjM5Mi02WiIvPgo8L3N2Zz4K" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --border: #2c3a4a;
      --text: #e8eef4;
      --muted: #8a9aab;
      --accent: #3d9cf0;
      --accent-soft: #1e3a5f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2a3a 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 90% 80%, #1a2830 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      gap: 1.25rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 span { color: var(--muted); font-weight: 400; font-size: 0.9em; }

    h1 span::before {
      content: "·";
      margin-right: 0.3em;
      margin-left: 0.3em;
    }

    .construction {
      align-self: stretch;
      width: calc(100% + 3rem);
      margin: -1.5rem -1.5rem 0;
      padding: 0.55rem 1rem;
      overflow: hidden;
      text-align: center;
      background-image: repeating-linear-gradient(
        -45deg,
        #111 0 12px,
        #f0c400 12px 24px
      );
      animation: hazard 0.7s linear infinite;
    }

    .construction span {
      display: inline-block;
      padding: 0.12rem 0.7rem;
      background: #f0c400;
      color: #111;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @keyframes hazard {
      to { background-position: 33.941px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .construction { animation: none; }
    }

    .hidden {
      visibility: hidden;
      display: none;
      height: 0px;
    }

    .content {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    body {
      user-select: none;
    }

    dialog {
      outline: none;
    }

    .toggles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1rem;
    }

    .toggle {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      position: relative;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle .track {
      width: 2.6rem;
      height: 1.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .toggle .track::after {
      content: "";
      position: absolute;
      top: 0.12rem;
      left: 0.12rem;
      width: 1.06rem;
      height: 1.06rem;
      border-radius: 50%;
      background: var(--text);
      transition: transform 0.15s ease;
    }

    .toggle input:checked + .track {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .toggle input:checked + .track::after {
      transform: translateX(1.18rem);
      background: var(--accent);
    }

    .toggle input:focus-visible + .track {
      box-shadow: 0 0 0 2px var(--accent-soft);
      border-color: var(--accent);
    }

    .score {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .score-label {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      justify-self: start;
    }

    .digits {
      display: flex;
      gap: 0.2rem;
      grid-column: 2;
      font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .digits span {
      display: grid;
      place-items: center;
      min-width: 1.35em;
      padding: 0.2rem 0.15rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .score-banked .digits {
      font-size: 1.35rem;
    }

    .score-points .digits {
      font-size: 1.85rem;
    }

    .score-points .digits span {
      min-width: 1.2em;
      padding: 0.28rem 0.18rem;
    }

    .lives {
      display: flex;
      justify-content: space-evenly;
      width: 100%;
    }

    .life {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
      color: var(--muted);
    }

    .life.active {
      color: #d97b7b;
    }

    .dice {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.55rem;
      width: 100%;
      padding: 0.45rem;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 12px;
    }

    .dice-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .slot {
      aspect-ratio: 1;
      width: 100%;
      border: 1px dashed color-mix(in srgb, var(--border) 80%, transparent);
      border-radius: 15px;
    }

    .die {
      width: 100%;
      height: 100%;
      background-image: url("../assets/dice/dice.svg");
      background-repeat: no-repeat;
      background-size: 800% 400%;
      background-position:
        calc(var(--cx, 7) / 7 * 100%)
        calc(var(--cy, 0) / 3 * 100%);
      cursor: pointer;


      /* &.white { --cy: 0; } */
      &[data-state="fresh"] { --cy: 1; }
      &[data-state="picked"] { --cy: 2; }
      &[data-state="locked"] { --cy: 3; }

      &[data-val="1"] { --cx: 0; }
      &[data-val="2"] { --cx: 1; }
      &[data-val="3"] { --cx: 2; }
      &[data-val="4"] { --cx: 3; }
      &[data-val="5"] { --cx: 4; }
      &[data-val="6"] { --cx: 5; }
      &[data-val="wild"] { --cx: 6; }
    }

    @property --cx {
      syntax: "<number>";
      inherits: true;
      initial-value: 7;
    }

    .die-cycle,
    .die-cycle-1,
    .die-cycle-2,
    .die-cycle-3,
    .die-cycle-4,
    .die-cycle-5 {
      animation: die-cycle 0.5s steps(6) infinite;
    }

    .die-cycle-1 { animation-delay: calc(-1 / 6 * 0.5s); }
    .die-cycle-2 { animation-delay: calc(-2 / 6 * 0.5s); }
    .die-cycle-3 { animation-delay: calc(-3 / 6 * 0.5s); }
    .die-cycle-4 { animation-delay: calc(-4 / 6 * 0.5s); }
    .die-cycle-5 { animation-delay: calc(-5 / 6 * 0.5s); }

    @keyframes die-cycle {
      from { --cx: 0; }
      to { --cx: 6; }
    }

    .feedback {
      min-height: 1.4em;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);

      &.success { color: #7dcb78; }
      &.info { color: var(--accent); }
      &.warning { color: #e0b060; }
      &.fail { color: #d97b7b; }
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      padding-inline: 10%;
    }

    .btn,
    .btn-plus {
      font-family: inherit;
      color: var(--accent);
      background: var(--panel);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .btn:hover:not(:disabled),
    .btn:focus-visible:not(:disabled),
    .btn-plus:hover:not(:disabled),
    .btn-plus:focus-visible:not(:disabled) {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      outline: none;
    }

    .btn:disabled,
    .btn-plus:disabled {
      color: var(--muted);
      cursor: default;
    }

    .btn {
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
    }

    .btn-plus {
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      border-radius: 50%;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    dialog {
      margin: auto;
      padding: 1.1rem 1.25rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: min(420px, calc(100% - 2rem));
      min-width: min(300px,100vw);
      margin-top: 10px;
    }

    dialog::backdrop {
      background: rgba(8, 12, 16, 0.45);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1.25rem;
      font-size: 0.8rem;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="construction" role="status"><span>Under construction</span></div>
  <h1>Greedy<span>A push your luck dice game</span></h1>

  <div class="content">
    <div class="toggles">
      <label class="toggle">
        Zilch
        <input id="tgl-zilch" type="checkbox" checked role="switch" name="zilch" />
        <span class="track"></span>
      </label>
      <label class="toggle">
        Wild
        <input id="tgl-wild" type="checkbox" role="switch" name="wild" />
        <span class="track"></span>
      </label>
      <label class="toggle">
        Crazy
        <input id="tgl-crazy" type="checkbox" role="switch" name="crazy" />
        <span class="track"></span>
      </label>
      <label class="toggle">
        Barrier
        <input id="tgl-barrier" type="checkbox" checked role="switch" name="barrier" />
        <span class="track"></span>
      </label>
    </div>

    <div id="lives" class="lives" aria-label="Lives">
      <span id="life-1" class="life">X</span>
      <span id="life-2" class="life">X</span>
      <span id="life-3" class="life">X</span>
    </div>

    <div class="score score-banked">
      <span class="score-label">Banked</span>
      <div id="banked-points" class="digits" aria-label="Banked points">
        <span>0</span><span>0</span><span>0</span><span>0</span><span>0</span>
      </div>
    </div>

    <div class="score score-points">
      <span class="score-label">Points</span>
      <div id="points" class="digits" aria-label="Points">
        <span>0</span><span>0</span><span>0</span><span>0</span><span>0</span>
      </div>
    </div>

    <div class="dice" aria-label="Dice">
      <div class="slot"><div id="die-0" data-state="" data-val="0" class="die white"></div></div>
      <div class="slot"><div id="die-1" data-state="" data-val="0" class="die white"></div></div>
      <div class="slot"><div id="die-2" data-state="" data-val="0" class="die white"></div></div>
      <div class="slot"><div id="die-3" data-state="" data-val="0" class="die white"></div></div>
      <div class="slot"><div id="die-4" data-state="" data-val="0" class="die white"></div></div>
      <div class="slot"><div id="die-5" data-state="" data-val="0" class="die white"></div></div>
    </div>

    <p id="feedback" class="feedback" aria-live="polite"></p>

    <div class="actions">
      <button id="roll" type="button" class="btn">Roll</button>
      <button id="plus" type="button" class="btn-plus" aria-label="Plus">+</button>
      <button id="bank" type="button" class="btn">Bank</button>
    </div>
  </div>

  <nav class="links">
    <a href="https://github.com/wlf-io/single-page-apps" target="_blank">GitHub</a>
    <a href="../LICENSE">MIT License</a>
  </nav>

  <dialog id="dice-pick-modal">
    <div id="wild-pick" class="dice dice-3">
      <div class="slot"><div data-val="1" class="die white"></div></div>
      <div class="slot"><div data-val="2" class="die white"></div></div>
      <div class="slot"><div data-val="3" class="die white"></div></div>
      <div class="slot"><div data-val="4" class="die white"></div></div>
      <div class="slot"><div data-val="5" class="die white"></div></div>
      <div class="slot"><div data-val="6" class="die white"></div></div>
    </div>
  </dialog>

  <dialog id="score-modal">
    <h2>Score: <span id="score"></span></h2>
  </dialog>

  <dialog id="scores-modal">
    <h2>Scores</h2>
    <ul id="scores"></ul>
  </dialog>

  <script>
    const DICE_STATE_NONE = "";
    const DICE_STATE_FRESH = "fresh";
    const DICE_STATE_PICKED = "picked";
    const DICE_STATE_LOCKED = "locked";

    const sounds_roll = [
      new Audio("../assets/dice/dice-roll-1.opus"),
      new Audio("../assets/dice/dice-roll-2.opus"),
      new Audio("../assets/dice/dice-roll-3.opus")
    ];

    const sounds_throw = [
      new Audio("../assets/dice/dice-throw-1.opus"),
      new Audio("../assets/dice/dice-throw-2.opus"),
      new Audio("../assets/dice/dice-throw-3.opus")
    ];

    const DICE_VAL_1 = 1;
    const DICE_VAL_2 = 2;
    const DICE_VAL_3 = 3;
    const DICE_VAL_4 = 4;
    const DICE_VAL_5 = 5;
    const DICE_VAL_6 = 6;
    const DICE_VAL_WILD = "wild";

    const ROLL_TIME = 600;

    const wildPick = document.getElementById("wild-pick");

    const die0 = document.getElementById("die-0");
    const die1 = document.getElementById("die-1");
    const die2 = document.getElementById("die-2");
    const die3 = document.getElementById("die-3");
    const die4 = document.getElementById("die-4");
    const die5 = document.getElementById("die-5");
    const dice = [die0, die1, die2, die3, die4, die5];

    const tglZilch = document.getElementById("tgl-zilch");
    const tglWild = document.getElementById("tgl-wild");
    const tglCrazy = document.getElementById("tgl-crazy");
    const tglBarrier = document.getElementById("tgl-barrier");
    const tgls = [tglZilch, tglWild, tglCrazy, tglBarrier];

    const livesRow = document.getElementById("lives");

    const life1 = document.getElementById("life-1");
    const life2 = document.getElementById("life-2");
    const life3 = document.getElementById("life-3");
    const lives = [life1, life2, life3];

    const rollBtn = document.getElementById("roll");
    const plusBtn = document.getElementById("plus");
    const bankBtn = document.getElementById("bank");
    const bankedPoints = document.getElementById("banked-points");
    const points = document.getElementById("points");
    const feedback = document.getElementById("feedback");
    const dicePickModal = document.getElementById("dice-pick-modal");
    const scoresModal = document.getElementById("scores-modal");
    const scoresDisplay = document.getElementById("scores");
    const scoreModal = document.getElementById("score-modal");
    const scoreDisplay = document.getElementById("score");

    let dieVals = [DICE_VAL_1, DICE_VAL_2, DICE_VAL_3, DICE_VAL_4, DICE_VAL_5, DICE_VAL_6];
    let dieStates = [DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE];
    let banked = 0;
    let score = 0;
    let busts = 0;
    let started = false;
    let gameOver = true;
    let zilches = 0;
    let turns = 0;
    let scores = [];

    function clearDice() {
      dieStates = [DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE, DICE_STATE_NONE];
      dieVals = [DICE_VAL_1, DICE_VAL_2, DICE_VAL_3, DICE_VAL_4, DICE_VAL_5, DICE_VAL_6];
      started = false;
      render();
    }

    let dieCycle = 0;

    function roll() {
      setFeedback("");
      sounds_roll[Math.floor(Math.random() * 3)].play();
      const all = dieStates.filter(s => s == DICE_STATE_PICKED || s == DICE_STATE_LOCKED).length == 6;
      if(all) {
        dieStates.fill(DICE_STATE_NONE);
      }
      const rolled = [];
      for (let i = 0; i < 6; i++) {
        const state = dieStates[i];
        if (state == DICE_STATE_LOCKED) continue;
        if (state == DICE_STATE_PICKED) {
          dieStates[i] = DICE_STATE_LOCKED;
          continue;
        }
        dieCycle++;
        dice[i].classList.add("die-cycle",`die-cycle-${dieCycle % 6}`);
        dieVals[i] = 1 + Math.floor(Math.random() * 6);
        dieStates[i] = DICE_STATE_FRESH;
        rolled.push(i);
      }
      if(tglWild.checked && Math.ceil(Math.random() * 100) > 95) {
        dieVals[rolled[Math.floor(Math.random() * rolled.length)]] = DICE_VAL_WILD;
      }
      setTimeout(()=>{
        for(const die of dice) {
          die.classList.remove(
            "die-cycle",
            "die-cycle-0",
            "die-cycle-1",
            "die-cycle-2",
            "die-cycle-3",
            "die-cycle-4",
            "die-cycle-5"
          );
        }
      },ROLL_TIME);
    }

    function setDice(vals) {
      for(const index in dieVals) {
        dieVals[index] = vals[index] || 1
      }
      render();
    }

    let feedbackTimer;

    function setFeedback(text, type) {
      clearTimeout(feedbackTimer);
      feedback.textContent = text;
      feedback.classList.remove("success", "info", "warning", "fail");
      if (type) feedback.classList.add(type);
      if (text) {
        feedbackTimer = setTimeout(() => setFeedback(""), 5000);
      }
    }

    function openDicePickModal() {
      dicePickModal.showModal();
    }

    function closeDicePickModal() {
      dicePickModal.close();
    }

    function openScoresModal() {
      scoresModal.showModal();
    }

    function closeScoresModal() {
      scoresModal.close();
    }

    function openScoreModal(score) {
      scoreDisplay.textContent = score.toString();
      scoreModal.showModal();
    }

    function closeScoreModal() {
      scoreModal.close();
    }

    function render() {
      for (let i = 0; i < 6; i++) {
        const die = dice[i];
        die.dataset.val = dieVals[i];
        die.dataset.state = dieStates[i];
      }
      bankBtn.disabled = !started;
      plusBtn.disabled = !started;
      renderPoints(bankedPoints, banked);
      const picked = getPickedDice();
      const pickedScore = isValidDiceSelection(picked) ? scoreSelection(picked) : 0;
      renderPoints(points, score + pickedScore);
      renderLives();
    }

    function renderPoints(elem, points) {
      const digits = elem.querySelectorAll("span");
      const str = points.toString().padStart(5, "0");
      for(let i = 0; i < 5; i++) {
        digits[i].textContent = str[i];
      }
    }

    if (window.self !== window.top) {
      const title = document.querySelector("h1");
      if (title) title.hidden = true;
    }

    function getDiceAtState(state) {
      const dice = [];
      for(let i = 0; i < 6; i++) {
        const at = dieStates[i];
        if (at == state) {
          dice.push(i);
        }
      }
      return dice;
    }

    function getDiceAtValue(value) {
      const dice = [];
      for(let i = 0; i < 6; i++) {
        const at = dieVals[i];
        if (at == value) {
          dice.push(i);
        }
      }
      return dice;
    }

    function getDiceNotAtState(state) {
      const dice = [];
      for(let i = 0; i < 6; i++) {
        const at = dieStates[i];
        if (at != state) {
          dice.push(i);
        }
      }
      return dice;
    }

    function getWildDice() {
      return getDiceAtValue(DICE_VAL_WILD);
    }

    function getPickedDice() {
      return getDiceAtState(DICE_STATE_PICKED);
    }

    function getLockedDice() {
      return getDiceAtState(DICE_STATE_LOCKED);
    }

    function getNotLockedDice() {
      return getDiceNotAtState(DICE_STATE_LOCKED);
    }

    function getAlwaysValidPickedDiceValues() {
      const valid = [1, 5];
      const locked = getLockedDice();
      const values = countUpSelectionValues(locked);
      for(const index in values) {
        if(values[index] > 2) {
          valid.push(parseInt(index) + 1);
        }
      }
      return valid.filter((val,i) => valid.indexOf(val) == i);
    }

    function countUpSelectionValues(selection) {
      const values = [0,0,0,0,0,0];
      for(const index of selection) {
        values[dieVals[index] - 1] += 1;
      }
      return values;
    }
  
    function checkSpecialHands(picked, reduce) {
      reduce = reduce || false;
      const counted = countUpSelectionValues(picked);
      const sorted = [...counted];
      sorted.sort();
      const getFiltered = (values) => values.filter(val => val > 0);
      const getUnique = (values) => values.filter((val,i) => values.indexOf(val) == i).sort();
      

      let filtered = getFiltered(counted);
      let unique = getUnique(filtered);

      if(filtered.length == 6 && unique.length == 1 && unique[0] == 1) {
        return true;
      }

      if(filtered.length == 5) {
        if(reduce) return true;
        if(unique.length == 1) {
          return unique[0] == 1 && (counted[0] == 0 || counted[5] == 0);
        } else if(unique.length == 2 && unique[0] == 1 && unique[1] == 2) {
          return counted[0] == 2 || counted[4] == 2;
        } else {
          return false;
        }
      }

      if(filtered.length == 5 && (reduce || (unique.length == 1 && unique[0] == 1 && (counted[0] == 0 || counted[6] == 0)))) {
        return true;
      }

      if(filtered.length == 2 && unique.length == 2 && unique[0] == 2 && unique[1] == 4) {
        return true;
      }

      if(filtered.length == 3 && unique.length == 1 && unique[0] == 2) {
        return true;
      }

      const minusOnesAndFives = [counted[1], counted[2], counted[3], counted[5]];
      filtered = getFiltered(minusOnesAndFives);

      if(reduce) {
        if(sorted[sorted.length - 1] >= 3) {
          return true;
        }
      } else {
        if(filtered.length == 1 && filtered[0] >= 3) {
          return true;
        }
      }

      return false;
    }

    function scoreSelection(selection) {
      const values = countUpSelectionValues(selection);
      const str = values.join("");
      if(str == "111111") return 1800;
      if(str == "011111" || str == "111110") return 900;
      if(str == "211110") return 1000;
      if(str == "011121") return 950;
      
      const getCounted = (values, min) => values.filter(val => val > (min || 0));
      const getUnique = (values) => values.filter((val,i) => values.indexOf(val) == i).sort();
      let counted = getCounted(values);
      let unique = getUnique(counted);

      if(counted.length == 3 && unique.length == 1 && unique[0] == 2) {
        return 1000;
      }
      if(counted.length == 2 && unique.length == 2 && unique[0] == 2 && unique[1] == 4) {
        return 1000;
      }

      let score = 0;
      const val = [100, 20, 30, 40, 50, 60];
      const mults = [0, 0, 10, 20, 40, 80];

      for(let i = 0; i < 6; i++) {
        const count = values[i];
        if(count < 1) continue;
        let mult = mults[count - 1];
        if((i == 0 || i == 4) && count < 3) {
          mult = count;
        }
        score += val[i] * mult;
      }
      return score;
    }

    function isValidDiceSelection(selection) {
      if (selection.length < 1) return false;
      const valid = getAlwaysValidPickedDiceValues();
      const invalid = [];
      for(const index of selection) {
        if(!valid.includes(dieVals[index])) {
          invalid.push(index);
        }
      }
      if(invalid.length > 0) {
        if(!checkSpecialHands(selection)) {
          return false;
        }
      }
      return true;
    }

    function hasValidDiceSelection(selection, reduce) {
      if(selection.length < 1) return false;
      const valid = getAlwaysValidPickedDiceValues();
      for(const index of selection) {
        if(valid.includes(dieVals[index])) {
          return true;
        }
      }
      return checkSpecialHands(selection, reduce);
    }

    function bust() {
      setFeedback("Bust", "fail");
      if(!tglZilch.checked) return;
      if(banked < 1) return;
      zilches++;
      if(zilches == 2) {
        setTimeout(()=>{
          setFeedback("Warning last life","warning");
        },700);
      }
      renderLives();
      if(zilches > 2) {
        busts++;
        gameOver = true;
        setTimeout(()=>{
          setFeedback("GAME OVER", "fail");
        },700);
      }
      save();
    }

    function renderLives()
    {
      for(let i = 0; i < 3; i++) {
        lives[i].classList.toggle("active", i < zilches);
      }
    }

    rollBtn.addEventListener("click", () => {
      if(gameOver) {
        reset();
        setFeedback("Game Start!","info");
      }
      if(!started) {
        clearDice();
        started = true;
        turns++;
      } else {
        const picked = getPickedDice();
        if(!isValidDiceSelection(picked)) {
          return;
        }
        score += scoreSelection(picked);
      }
      if(getWildDice().length > 0) {
        setFeedback("Must choose wild dice first", "info");
        return;
      }
      roll();
      const notLocked = getNotLockedDice();
      if(!hasValidDiceSelection(notLocked, true) && getWildDice().length < 1) {
        started = false;
        score = 0;
        dieStates.fill(DICE_STATE_NONE);
        setTimeout(bust, ROLL_TIME);
      }
      render();
      save();
    });

    function checkSelected(reduce) {
      const picked = getPickedDice();
      console.log(picked, hasValidDiceSelection(picked, !!reduce));
    }

    plusBtn.addEventListener("click", () => {
      if(!started) return;
      const picked = getPickedDice().length < 6;
      for(let i = 0; i < 6; i++) {
        const state = dieStates[i];
        if (state == DICE_STATE_LOCKED) continue;
        dieStates[i] = picked ? DICE_STATE_PICKED : DICE_STATE_NONE;
      }
      render();
    });

    bankBtn.addEventListener("click", () => {
      if(!started) return;
      const picked = getPickedDice();
      if(!isValidDiceSelection(picked))
      {
        return;
      }
      const current = scoreSelection(picked);
      if(tglBarrier.checked) {
        if((score + current) < 1000 && banked < 1000) {
          setFeedback("First bank must be atleast 1000", "warning");
          return;
        }
      }
      score += current;
      banked += score;
      score = 0;
      for(let i = 0; i < 6; i++) {
        dieStates[i] = DICE_STATE_NONE;
      }
      started = false;
      zilches = 0;
      if(banked >= 10000) {
        gameOver = true;
        scores.push([banked,turns]);
        openScoreModal(banked);
        setFeedback("Success!","success");
      }
      render();
      save();
    });

    function dieClick(die, index) {
      if(!started) return;
      const val = dieVals[index];
      if(val == DICE_VAL_WILD) {
        openDicePickModal();
        return;
      }
      for(const i in dieStates) {
        if(dieStates[i] == DICE_STATE_FRESH) {
          dieStates[i] = DICE_STATE_NONE;
        }
      }
      const state = dieStates[index];
      if (state == DICE_STATE_LOCKED) return;
      dieStates[index] = state == DICE_STATE_PICKED ? DICE_STATE_NONE : DICE_STATE_PICKED;
      render();
      save();
    }

    for (const index in dice) {
      dice[index].addEventListener("click", () => dieClick(dice[index], index));
    }

    function saveOptions() {
      const data = {
        zilch: tglZilch.checked,
        wild: tglWild.checked,
        crazy: tglCrazy.checked,
        barrier: tglBarrier.checked,
      };
      localStorage.setItem("greedy-options",JSON.stringify(data));
      livesRow.classList.toggle("hidden", !data.zilch);
    }

    function loadOptions() {
      const savedData = localStorage.getItem("greedy-options");
      if(savedData) {
        const data = JSON.parse(savedData);
        if(typeof data == "object" && data != null) {
          tglZilch.checked = data.zilch;
          tglWild.checked = data.wild;
          tglCrazy.checked = data.crazy;
          tglBarrier.checked = data.barrier;
        }
      }
      saveOptions();
    }

    for (const tgl of tgls) {
      tgl.addEventListener("input", saveOptions);
    }


    function reset() {
      started = false;
      banked = 0;
      score = 0;
      zilches = 0;
      dieStates.fill(DICE_STATE_NONE);
      dieVals.fill(0);
      turns = 0;
      gameOver = false;
      render();
    }

    function save() {
      const data = {
        values: dieVals,
        states: dieStates,
        started: started,
        score: score,
        banked: banked,
        turns: turns,
        zilches: zilches,
        over: gameOver,
        busts: busts,
        scores: scores,
      };
      localStorage.setItem("greedy-save", JSON.stringify(data));
    }

    function load() {
      const saveData = localStorage.getItem("greedy-save");
      if(saveData) {
        const data = JSON.parse(saveData);
        console.log("Load:", data);
        banked = data.banked || 0;
        score = data.score || 0;
        zilches = data.zilches || 0;
        turns = data.turns || 0;
        started = !!data.started;
        busts = data.busts || 0;
        gameOver = !!data.gameOver;
        if(data.scores instanceof Array) {
          for(const score of data.scores) {
            scores.push(score);
          }
        }
        if(data.values instanceof Array) {
          for(const i in dieVals) {
            dieVals[i] = data.values[i] || false;
            console.log("vals",dieVals,data.values,i);
          }
        }
        if(data.states instanceof Array) {
          for(const i in dieStates) {
            const state = data.states[i];
            dieStates[i] = typeof state === "string" ? state : false;
            console.log("states",dieStates,data.states,i);
          }
        }
        if(dieStates.some(v => v === false) || dieVals.some(v => v === false)) {
          console.log("Save Load Failed");
          reset();
        } else {
          render();
        }
      }
    }

    wildPick.addEventListener("click", (event) => {
      if(!event.target.classList.contains("die")) return;
      const val = event.target.dataset.val || false;
      if(val) {
        const wilds = getWildDice();
        for(const index of wilds) {
          dieVals[index] = parseInt(val);
        }
        for(const i in dieStates) {
          if(dieStates[i] == DICE_STATE_FRESH) {
            dieStates[i] = DICE_STATE_NONE;
          }
        }
        render();
        closeDicePickModal();
        save();
      }
    });

    loadOptions();
    load();
    render();

  </script>
</body>
</html>
