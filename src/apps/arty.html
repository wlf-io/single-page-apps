<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Right Triangle from Range</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/base.css" />
  <link rel="stylesheet" href="/apps/arty.css" />
</head>
<body>
  <h1>Arty Calc<span>Ranging and Angle Calculation</span></h1>

  <div class="layout">
    <aside class="panel">
      <div class="panel-head">
        <h2>Coordinates (m)</h2>
        <label class="range-mult">Range ×
          <input id="range-mult" type="number" value="100" step="1" />
        </label>
      </div>

      <div class="point-group">
        <div class="point-label">Origin</div>
        <div class="coords">
          <label>X <input id="ax" type="number" value="-10" step="1" /></label>
          <label>Y <input id="ay" type="number" value="10" step="1" /></label>
        </div>
      </div>

      <div class="point-group">
        <div class="point-label">Target</div>
        <div class="coords">
          <label>X <input id="bx" type="number" value="10" step="1" /></label>
          <label>Y <input id="by" type="number" value="-10" step="1" /></label>
        </div>
      </div>

      <div class="hyp-stats" id="hyp-stats">
        <span class="hyp-len">Range —</span>
        <span class="hyp-ang">— Angle</span>
      </div>

      <details class="stats-details">
        <summary>Details</summary>
        <div class="stats" id="stats">Enter two points.</div>
      </details>
    </aside>

    <div class="canvas-wrap">
      <canvas id="c" width="720" height="720"></canvas>
    </div>
  </div>

  <nav class="links">
    <a href="https://github.com/wlf-io/single-page-apps" target="_blank">GitHub</a>
    <a href="../LICENSE">MIT License</a>
  </nav>

  <script src="/assets/general.js"></script>
  <script src="/apps/arty.js"></script></script>
</body>
</html>
