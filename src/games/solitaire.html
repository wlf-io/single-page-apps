<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solitaire</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/base.css"/>
  <link rel="stylesheet" href="/games/solitaire.css"/>
  <style>
    
  </style>
</head>
<body>
  <div class="construction" role="status"><span>Under construction</span></div>
  <h1>Solitaire<span>The classic klondike card game</span></h1>

  <div class="content">
    <div class="toolbar">
      <button type="button" id="shuffle">Shuffle</button>
      <div class="toolbar-end">
        <button type="button" id="undo" disabled>Undo</button>
        <button type="button" id="redo" disabled>Redo</button>
      </div>
    </div>
    <div class="board">
      <div class="row top">
        <div class="slot stock" aria-label="Stock"></div>
        <div class="slot waste" aria-label="Waste"></div>
        <div class="gap" aria-hidden="true"></div>
        <div class="slot foundation-0" aria-label="Foundation 1"></div>
        <div class="slot foundation-1" aria-label="Foundation 2"></div>
        <div class="slot foundation-2" aria-label="Foundation 3"></div>
        <div class="slot foundation-3" aria-label="Foundation 4"></div>
      </div>
      <div class="row tableau">
        <div class="pile tableau-0"><div class="slot" aria-label="Tableau 1"></div></div>
        <div class="pile tableau-1"><div class="slot" aria-label="Tableau 2"></div></div>
        <div class="pile tableau-2"><div class="slot" aria-label="Tableau 3"></div></div>
        <div class="pile tableau-3"><div class="slot" aria-label="Tableau 4"></div></div>
        <div class="pile tableau-4"><div class="slot" aria-label="Tableau 5"></div></div>
        <div class="pile tableau-5"><div class="slot" aria-label="Tableau 6"></div></div>
        <div class="pile tableau-6"><div class="slot" aria-label="Tableau 7"></div></div>
      </div>
      <div class="cards">
        <div class="card card-s1 flipped" style="left: calc(0 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s2 flipped" style="left: calc(1 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s3 flipped" style="left: calc(2 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s4 flipped" style="left: calc(3 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s5 flipped" style="left: calc(4 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s6 flipped" style="left: calc(5 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s7 flipped" style="left: calc(6 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s8 flipped" style="left: calc(7 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s9 flipped" style="left: calc(8 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s10 flipped" style="left: calc(9 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s11 flipped" style="left: calc(10 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s12 flipped" style="left: calc(11 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-s13 flipped" style="left: calc(12 * (100% - var(--card-w)) / 12); top: calc(0 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h1 flipped" style="left: calc(0 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h2 flipped" style="left: calc(1 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h3 flipped" style="left: calc(2 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h4 flipped" style="left: calc(3 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h5 flipped" style="left: calc(4 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h6 flipped" style="left: calc(5 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h7 flipped" style="left: calc(6 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>

        <div class="card card-h9 flipped" style="left: calc(8 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h10 flipped" style="left: calc(9 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h11 flipped" style="left: calc(10 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h12 flipped" style="left: calc(11 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-h13 flipped" style="left: calc(12 * (100% - var(--card-w)) / 12); top: calc(1 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c1 flipped" style="left: calc(0 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c2 flipped" style="left: calc(1 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c3 flipped" style="left: calc(2 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c4 flipped" style="left: calc(3 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c5 flipped" style="left: calc(4 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c6 flipped" style="left: calc(5 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c7 flipped" style="left: calc(6 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c8 flipped" style="left: calc(7 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c9 flipped" style="left: calc(8 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c10 flipped" style="left: calc(9 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c11 flipped" style="left: calc(10 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c12 flipped" style="left: calc(11 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-c13 flipped" style="left: calc(12 * (100% - var(--card-w)) / 12); top: calc(2 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d1 flipped" style="left: calc(0 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d2 flipped" style="left: calc(1 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d3 flipped" style="left: calc(2 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d4 flipped" style="left: calc(3 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d5 flipped" style="left: calc(4 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d6 flipped" style="left: calc(5 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d7 flipped" style="left: calc(6 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d8 flipped" style="left: calc(7 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d9 flipped" style="left: calc(8 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d10 flipped" style="left: calc(9 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d11 flipped" style="left: calc(10 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d12 flipped" style="left: calc(11 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
        <div class="card card-d13 flipped" style="left: calc(12 * (100% - var(--card-w)) / 12); top: calc(3 * (var(--card-h) + 0.55rem));"></div>
      </div>
    </div>
  </div>

  <nav class="links">
