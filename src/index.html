<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wlf.io Apps</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/base.css" />
  <link rel="stylesheet" href="/index.css" />
</head>
<body>
  <header class="topbar">
    <button class="burger" type="button" aria-label="Open app menu" aria-expanded="false" aria-controls="sidebar">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <h1>wlf.io Apps</h1>
    <div class="topbar-app" hidden>
      <p class="topbar-app-name"></p>
      <p class="topbar-app-blurb"></p>
    </div>
    <nav class="topbar-actions" hidden>
      <a class="topbar-btn topbar-open" href="#">Open page</a>
      <button class="topbar-btn topbar-download" type="button">Download</button>
    </nav>
  </header>

  <div class="workspace">
  <div class="scrim" hidden></div>
  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <a class="sidebar-home" href="index.html">Home</a>
    <div id="sidebar-apps"></div>
  </aside>

  <div class="page">
    <div class="home">
    <p class="subtitle">Small self contained tools</p>
    <p class="intro">
      A handful of single-file web apps with no external dependencies, so they can be opened locally or hosted anywhere.
    </p>

    <div class="panel" id="home-apps"></div>

    <nav class="links">
      <a href="https://github.com/wlf-io/single-page-apps">GitHub</a>
      <a href="LICENSE">MIT License</a>
    </nav>
    </div>
    <iframe class="app-frame" title="App" hidden></iframe>
  </div>
  </div>

  <script type="application/json" id="apps-data">
    [
      {
        "id": "arty",
        "name": "Arty Calc",
        "href": "apps/arty.html",
        "blurb": "Trig range and angle calculator, meant for artillery in games.",
        "debug": false,
        "category": "tools"
      },
      {
        "id": "json-cmp",
        "name": "JSON Compare",
        "href": "apps/json-cmp.html",
        "blurb": "Side-by-side JSON comparison.",
        "debug": false,
        "category": "tools"
      },
      {
        "id": "template",
        "name": "Template",
        "href": "template.html",
        "blurb": "Empty app layout to copy when starting a new tool.",
        "debug": true,
        "category": "debug"
      },
      {
        "id": "solitaire",
        "name": "Solitaire",
        "href": "games/solitaire.html",
        "blurb": "Klondike solitaire.",
        "debug": false,
        "category": "games"
      },
      {
        "id": "greedy",
        "name": "Greedy",
        "href": "games/greedy.html",
        "blurb": "Greedy.",
        "debug": false,
        "category": "games"
      },
      {
        "id": "text-sync",
        "name": "Text Sync",
        "href": "apps/text-sync.html",
        "blurb": "Text Sync Data between instances",
        "debug": true,
        "category": "tools"
      },
      {
        "id": "testing",
        "name": "Testing",
        "href": "debug/testing.html",
        "blurb": "Testing page for debugging purposes.",
        "debug": true,
        "category": "debug"
      }
    ]
  </script>
  <script src="/index.js"></script>
</body>
</html>
