<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wlf.io Single page apps</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --border: #2c3a4a;
      --text: #e8eef4;
      --muted: #8a9aab;
      --accent: #3d9cf0;
      --accent-soft: #1e3a5f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2a3a 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 90% 80%, #1a2830 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      gap: 1.25rem;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      text-align: center;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-weight: 400;
      font-size: 0.95rem;
    }

    .intro {
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 520px;
      text-align: center;
      line-height: 1.5;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      width: 100%;
      max-width: 520px;
    }

    .panel h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }

    .apps {
      list-style: none;
      display: grid;
      gap: 0.65rem;
    }

    .apps a {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
    }

    .apps a:hover,
    .apps a:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      outline: none;
    }

    .apps .name {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .apps .blurb {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1.25rem;
      font-size: 0.8rem;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>wlf.io Single page apps</h1>
    <p class="subtitle">Small self contained tools</p>
  </header>
  <p class="intro">
    A handful of single-file web apps with no external dependencies, so they can be opened locally or hosted anywhere.
  </p>

  <div class="panel">
    <h2>Apps</h2>
    <ul class="apps">
      <li>
        <a href="arty.html">
          <span class="name">Arty Calc</span>
          <span class="blurb">Trig range and angle calculator, meant for artillery in games.</span>
        </a>
      </li>
    </ul>
  </div>

  <nav class="links">
    <a href="https://github.com/wlf-io/single-page-apps">GitHub</a>
    <a href="LICENSE">MIT License</a>
  </nav>
</body>
</html>
