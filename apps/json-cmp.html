<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Compare</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPCEtLSBFcXVhbC1lZGdlIGlzb21ldHJpYyBjdWJlOiAzMMKwIHJob21iaSwgdmVydGljYWwgPSBlZGdlIGxlbmd0aCAtLT4KICA8cGF0aCBmaWxsPSIjM2Q5Y2YwIiBkPSJNMTYgNCAyNi4zOTIgMTAgMTYgMTYgNS42MDggMTBaIi8+CiAgPHBhdGggZmlsbD0iIzJhNmZhZCIgZD0iTTUuNjA4IDEwIDE2IDE2djEybC0xMC4zOTItNloiLz4KICA8cGF0aCBmaWxsPSIjMWU0ZjgyIiBkPSJNMjYuMzkyIDEwIDE2IDE2djEybDEwLjM5Mi02WiIvPgo8L3N2Zz4K" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --border: #2c3a4a;
      --text: #e8eef4;
      --muted: #8a9aab;
      --accent: #3d9cf0;
      --accent-soft: #1e3a5f;
      --ok: #6fd0a0;
      --err: #f07070;
      --warn: #e0b060;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2a3a 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 90% 80%, #1a2830 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      gap: 1.25rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    h1 span { color: var(--muted); font-weight: 400; font-size: 0.9em; }

    .content {
      width: 100%;
      max-width: 1400px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      flex-shrink: 0;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      appearance: none;
      width: 2.4rem;
      height: 1.3rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 0.9rem;
      height: 0.9rem;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .toggle input:checked {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .toggle input:checked::after {
      transform: translateX(1.05rem);
      background: var(--accent);
    }

    .toggle input:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status.match { color: var(--ok); }
    .status.diff { color: var(--warn); }
    .status.error { color: var(--err); }

    .editors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      flex: 1;
      min-height: 240px;
    }

    .pane {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
      min-width: 0;
    }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .pane h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    button {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.28rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      outline: none;
    }

    textarea {
      flex: 1;
      width: 100%;
      min-height: 220px;
      resize: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.7rem 0.75rem;
      font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      tab-size: 2;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .pane.error textarea { border-color: var(--err); }

    .diffs {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 0.95rem;
      flex-shrink: 0;
      max-height: 28vh;
      overflow: auto;
    }

    .diffs h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .diffs[hidden] { display: none; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace;
    }

    th, td {
      text-align: left;
      padding: 0.35rem 0.5rem 0.35rem 0;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    tr:last-child td { border-bottom: none; }

    .kind {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--warn);
    }

    .kind.added { color: var(--ok); }
    .kind.removed { color: var(--err); }

    .val { color: var(--text); word-break: break-word; }
    .empty { color: var(--muted); }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1.25rem;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }

    @media (max-width: 800px) {
      .editors { grid-template-columns: 1fr; }
      .diffs { max-height: 36vh; }
    }
  </style>
</head>
<body>
  <h1>JSON Compare <span>· Side-by-side JSON diff</span></h1>

  <div class="content">
    <div class="toolbar">
      <label class="toggle">
        <input id="order" type="checkbox" checked />
        Match array order
      </label>
      <div class="status" id="status">Paste JSON on both sides to compare.</div>
    </div>

    <div class="editors">
      <section class="pane" id="pane-left">
        <div class="pane-head">
          <h2>Left</h2>
          <button type="button" id="format-left">Format</button>
        </div>
        <textarea id="left" spellcheck="false" placeholder="Paste JSON…"></textarea>
      </section>
      <section class="pane" id="pane-right">
        <div class="pane-head">
          <h2>Right</h2>
          <button type="button" id="format-right">Format</button>
        </div>
        <textarea id="right" spellcheck="false" placeholder="Paste JSON…"></textarea>
      </section>
    </div>

    <section class="diffs" id="diffs" hidden>
      <h2>Differences</h2>
      <table>
        <thead>
          <tr>
            <th>Kind</th>
            <th>Path</th>
            <th>Left</th>
            <th>Right</th>
          </tr>
        </thead>
        <tbody id="diff-body"></tbody>
      </table>
    </section>
  </div>

  <nav class="links">
    <a href="https://github.com/wlf-io/single-page-apps">GitHub</a>
    <a href="../LICENSE">MIT License</a>
  </nav>

  <script>
    const leftEl = document.getElementById("left");
    const rightEl = document.getElementById("right");
    const orderEl = document.getElementById("order");
    const statusEl = document.getElementById("status");
    const diffsEl = document.getElementById("diffs");
    const diffBody = document.getElementById("diff-body");
    const paneLeft = document.getElementById("pane-left");
    const paneRight = document.getElementById("pane-right");

    function typeOf(v) {
      if (v === null) return "null";
      if (Array.isArray(v)) return "array";
      return typeof v;
    }

    function identPath(key) {
      return /^[A-Za-z_$][\w$]*$/.test(key) ? "." + key : "[" + JSON.stringify(key) + "]";
    }

    function pathLength(path) {
      let i = path.startsWith("$") ? 1 : 0;
      let n = 0;
      while (i < path.length) {
        if (path[i] === ".") {
          i++;
          while (i < path.length && /[\w$]/.test(path[i])) i++;
          n++;
        } else if (path[i] === "[") {
          i++;
          if (path[i] === '"') {
            i++;
            while (i < path.length) {
              if (path[i] === "\\") { i += 2; continue; }
              if (path[i] === '"') { i++; break; }
              i++;
            }
          } else {
            while (i < path.length && path[i] !== "]") i++;
          }
          if (path[i] === "]") i++;
          n++;
        } else {
          i++;
        }
      }
      return n;
    }

    function compareDiffs(a, b) {
      const byDepth = pathLength(a.path) - pathLength(b.path);
      if (byDepth) return byDepth;
      return a.path < b.path ? -1 : a.path > b.path ? 1 : 0;
    }

    function deepEqual(a, b, orderMatters) {
      const ta = typeOf(a);
      const tb = typeOf(b);
      if (ta !== tb) return false;
      if (ta === "array") {
        if (a.length !== b.length) return false;
        if (orderMatters) {
          return a.every((item, i) => deepEqual(item, b[i], orderMatters));
        }
        const used = new Array(b.length).fill(false);
        for (const item of a) {
          let found = false;
          for (let i = 0; i < b.length; i++) {
            if (used[i]) continue;
            if (deepEqual(item, b[i], orderMatters)) {
              used[i] = true;
              found = true;
              break;
            }
          }
          if (!found) return false;
        }
        return true;
      }
      if (ta === "object") {
        const keys = Object.keys(a);
        if (keys.length !== Object.keys(b).length) return false;
        return keys.every((key) =>
          Object.prototype.hasOwnProperty.call(b, key) &&
          deepEqual(a[key], b[key], orderMatters)
        );
      }
      return Object.is(a, b);
    }

    function collectDiffs(a, b, path, orderMatters, out) {
      const ta = typeOf(a);
      const tb = typeOf(b);
      if (ta !== tb) {
        out.push({ kind: "changed", path, left: a, right: b });
        return;
      }
      if (ta === "array") {
        if (orderMatters) {
          const n = Math.max(a.length, b.length);
          for (let i = 0; i < n; i++) {
            const p = path + "[" + i + "]";
            if (i >= a.length) out.push({ kind: "added", path: p, right: b[i] });
            else if (i >= b.length) out.push({ kind: "removed", path: p, left: a[i] });
            else collectDiffs(a[i], b[i], p, orderMatters, out);
          }
          return;
        }
        const used = new Array(b.length).fill(false);
        a.forEach((item, i) => {
          let found = -1;
          for (let j = 0; j < b.length; j++) {
            if (used[j]) continue;
            if (deepEqual(item, b[j], orderMatters)) {
              found = j;
              break;
            }
          }
          if (found >= 0) used[found] = true;
          else out.push({ kind: "removed", path: path + "[" + i + "]", left: item });
        });
        b.forEach((item, j) => {
          if (!used[j]) out.push({ kind: "added", path: path + "[" + j + "]", right: item });
        });
        return;
      }
      if (ta === "object") {
        const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
        for (const key of keys) {
          const p = path + identPath(key);
          const hasA = Object.prototype.hasOwnProperty.call(a, key);
          const hasB = Object.prototype.hasOwnProperty.call(b, key);
          if (!hasA) out.push({ kind: "added", path: p, right: b[key] });
          else if (!hasB) out.push({ kind: "removed", path: p, left: a[key] });
          else collectDiffs(a[key], b[key], p, orderMatters, out);
        }
        return;
      }
      if (!Object.is(a, b)) out.push({ kind: "changed", path, left: a, right: b });
    }

    function parsePane(text) {
      const trimmed = text.trim();
      if (!trimmed) return { empty: true };
      try {
        return { value: JSON.parse(trimmed) };
      } catch (err) {
        return { error: err.message };
      }
    }

    function preview(value) {
      if (value === undefined) return "";
      const text = JSON.stringify(value);
      return text.length > 96 ? text.slice(0, 93) + "…" : text;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function render() {
      const left = parsePane(leftEl.value);
      const right = parsePane(rightEl.value);
      const orderMatters = orderEl.checked;
      paneLeft.classList.toggle("error", Boolean(left.error));
      paneRight.classList.toggle("error", Boolean(right.error));
      diffBody.replaceChildren();
      diffsEl.hidden = true;

      if (left.empty && right.empty) {
        setStatus("Paste JSON on both sides to compare.");
        return;
      }
      if (left.empty || right.empty) {
        setStatus("Waiting for the other side.");
        return;
      }

      const errors = [];
      if (left.error) errors.push("Left: " + left.error);
      if (right.error) errors.push("Right: " + right.error);
      if (errors.length) {
        setStatus(errors.join("  ·  "), "error");
        return;
      }

      const diffs = [];
      collectDiffs(left.value, right.value, "$", orderMatters, diffs);
      diffs.sort(compareDiffs);
      if (!diffs.length) {
        setStatus("JSON matches.", "match");
        return;
      }

      setStatus(
        "JSON differs (" + diffs.length + " difference" + (diffs.length === 1 ? "" : "s") + ").",
        "diff"
      );
      diffsEl.hidden = false;
      for (const diff of diffs) {
        const tr = document.createElement("tr");
        const kind = document.createElement("td");
        kind.className = "kind " + diff.kind;
        kind.textContent = diff.kind;
        const path = document.createElement("td");
        path.textContent = diff.path;
        const leftCell = document.createElement("td");
        leftCell.className = diff.left === undefined ? "empty" : "val";
        leftCell.textContent = diff.left === undefined ? "—" : preview(diff.left);
        const rightCell = document.createElement("td");
        rightCell.className = diff.right === undefined ? "empty" : "val";
        rightCell.textContent = diff.right === undefined ? "—" : preview(diff.right);
        tr.append(kind, path, leftCell, rightCell);
        diffBody.append(tr);
      }
    }

    const STORAGE_PREFIX = "json-comp-";

    function saveState() {
      try {
        localStorage.setItem(STORAGE_PREFIX + "left", leftEl.value);
        localStorage.setItem(STORAGE_PREFIX + "right", rightEl.value);
        localStorage.setItem(STORAGE_PREFIX + "order", orderEl.checked ? "1" : "0");
      } catch {
        // ignore quota / private-mode failures
      }
    }

    function restoreState() {
      try {
        const left = localStorage.getItem(STORAGE_PREFIX + "left");
        const right = localStorage.getItem(STORAGE_PREFIX + "right");
        const order = localStorage.getItem(STORAGE_PREFIX + "order");
        if (left != null) leftEl.value = left;
        if (right != null) rightEl.value = right;
        if (order != null) orderEl.checked = order === "1";
      } catch {
        // ignore unreadable storage
      }
    }

    function onPaneChange() {
      saveState();
      render();
    }

    function formatPane(el) {
      const parsed = parsePane(el.value);
      if (parsed.empty || parsed.error) {
        onPaneChange();
        return;
      }
      el.value = JSON.stringify(parsed.value, null, 2);
      onPaneChange();
    }

    leftEl.addEventListener("input", onPaneChange);
    rightEl.addEventListener("input", onPaneChange);
    orderEl.addEventListener("change", onPaneChange);
    document.getElementById("format-left").addEventListener("click", () => formatPane(leftEl));
    document.getElementById("format-right").addEventListener("click", () => formatPane(rightEl));

    restoreState();
    render();

    if (window.self !== window.top) {
      const title = document.querySelector("h1");
      if (title) title.hidden = true;
    }
  </script>
</body>
</html>
